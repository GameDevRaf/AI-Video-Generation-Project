name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application and docs
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_SUPABASE_URL: https://ci.invalid.example
      NUXT_PUBLIC_SUPABASE_KEY: ci-public-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs-site

      - name: Check documentation
        run: npm run check
        working-directory: docs-site

      - name: Audit documentation dependencies
        run: npm audit --audit-level=high
        working-directory: docs-site

      - name: Run unit and local integration tests
        run: npm test

      - name: Typecheck Nuxt application
        run: npx nuxi typecheck

      - name: Build Nuxt application
        run: npm run build

      - name: Audit application dependencies
        run: npm audit --audit-level=high

  secret-scan:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
